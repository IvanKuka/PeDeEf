# Builds the Windows and macOS applications on every push and on demand.
# The zips appear under the workflow run → "Artifacts"; pushing a tag such as v1.1.0
# additionally publishes them as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed only by the release job

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PDF-Nastroje-windows
          # macos-latest runs on Apple Silicon, so the app is built for M1 and newer Macs.
          - os: macos-latest
            artifact: PDF-Nastroje-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test and build
        run: python build.py

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.artifact }}.zip
          # Upload the zip as-is, so downloading it from the run page does not
          # produce a zip inside a zip. The artifact is named after the file.
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          # The artifacts are the release zips themselves; keep them packed.
          skip-decompress: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # find: the zips' location inside artifacts/ is not relied upon.
        run: |
          mapfile -t zips < <(find artifacts -name 'PDF-Nastroje-*.zip')
          if [ "${#zips[@]}" -ne 2 ]; then echo "Expected 2 zips, found: ${zips[*]}"; exit 1; fi
          gh release create "${{ github.ref_name }}" "${zips[@]}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
