# Builds the Windows and macOS applications on every push and on demand.
# The zips and installers appear under the workflow run → "Artifacts"; pushing a tag such as v1.1.0
# additionally publishes them as a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed only by the release job

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: PDF-Nastroje-windows.zip
            installer: PDF-Nastroje-Setup.exe
          # macos-latest runs on Apple Silicon, so the app is built for M1 and newer Macs.
          - os: macos-latest
            zip: PDF-Nastroje-macos.zip
            installer: PDF-Nastroje-macos.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test and build
        run: python build.py

      # Files are uploaded as-is (archive: false), so downloading one from the run page
      # gives the file itself, not a zip around it. Each artifact is named after its file;
      # unzipped uploads take a single file, hence one step per file.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.zip }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.installer }}
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          # The artifacts are the release zips themselves; keep them packed.
          skip-decompress: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # find: the files' location inside artifacts/ is not relied upon.
        run: |
          mapfile -t files < <(find artifacts -type f -name 'PDF-Nastroje-*')
          if [ "${#files[@]}" -ne 4 ]; then echo "Expected 4 files (2 zips, Setup.exe, .dmg), found: ${files[*]}"; exit 1; fi
          gh release create "${{ github.ref_name }}" "${files[@]}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
